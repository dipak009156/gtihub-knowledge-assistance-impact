services:
  # 1. Main Unified Web Application (Frontend + Backend + AI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gka-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    volumes:
      - app-data:/app/backend/data
      - app-storage:/tmp/gka

  # 2. Free Public Share Tunnel (Cloudflare Tunnel)
  # Automatically creates a secure, shareable public HTTPS link for friends
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gka-tunnel
    restart: unless-stopped
    command: tunnel --url http://app:8000 --no-autoupdate
    depends_on:
      - app

  # 3. Optional PostgreSQL + pgvector service (activate with --profile postgres)
  db:
    profiles: ["postgres"]
    build: ./db
    image: gka-postgres-pgvector:16
    container_name: gka-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gka_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gka}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  app-data:
  app-storage:
  pgdata:
